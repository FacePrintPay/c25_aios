<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C25 Sovereign Graph — 334,694 Files</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        /* Header Stats Bar */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%);
            border-bottom: 2px solid #0f0;
            padding: 15px 20px;
            z-index: 1000;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0, 255, 0, 0.2);
        }
        
        .stat-box {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #0f0;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        
        .stat-sub {
            font-size: 10px;
            color: #666;
            margin-top: 3px;
        }
        
        /* Main Graph Container */
        #graph-container {
            margin-top: 120px;
            width: 100vw;
            height: calc(100vh - 120px);
            position: relative;
        }
        
        /* Controls */
        #controls {
            position: fixed;
            top: 120px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #0f0;
            border-radius: 8px;
            padding: 15px;
            z-index: 100;
            max-width: 300px;
        }
        
        #controls h3 {
            color: #0f0;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .filter-group {
            margin-bottom: 15px;
        }
        
        .filter-label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .filter-checkbox {
            margin-right: 5px;
        }
        
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 2px;
            font-size: 12px;
        }
        
        button:hover {
            background: #0c0;
            transform: translateY(-1px);
        }
        
        /* Tooltip */
        #tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #0f0;
            border-radius: 8px;
            padding: 15px;
            font-size: 12px;
            max-width: 400px;
            display: none;
            z-index: 2000;
            box-shadow: 0 4px 20px rgba(0, 255, 0, 0.3);
        }
        
        #tooltip .path {
            color: #0f0;
            font-weight: bold;
            margin-bottom: 8px;
            word-break: break-all;
        }
        
        #tooltip .meta {
            color: #888;
            margin: 3px 0;
            font-size: 11px;
        }
        
        /* Legend */
        #legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #0f0;
            border-radius: 8px;
            padding: 15px;
            z-index: 100;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 11px;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 5px currentColor;
        }
        
        /* Node hover effects */
        .node {
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .node:hover {
            filter: brightness(1.5);
            stroke: #fff;
            stroke-width: 2px;
        }
        
        .link {
            stroke-opacity: 0.3;
            transition: stroke-opacity 0.3s;
        }
        
        /* Loading animation */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 3000;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #0f0;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header Stats -->
    <div id="header">
        <div class="stat-box">
            <div class="stat-label">Total Files</div>
            <div class="stat-value" id="total-files">0</div>
            <div class="stat-sub">334,694 scanned</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Connections</div>
            <div class="stat-value" id="total-edges">0</div>
            <div class="stat-sub">Dependencies</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Total Size</div>
            <div class="stat-value" id="total-size">0</div>
            <div class="stat-sub">Megabytes</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">File Types</div>
            <div class="stat-value" id="total-types">0</div>
            <div class="stat-sub">Categories</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Live Status</div>
            <div class="stat-value" style="color: #0f0">● LIVE</div>
            <div class="stat-sub">Real-time</div>
        </div>
    </div>
    
    <!-- Controls -->
    <div id="controls">
        <h3>🔍 Filters</h3>
        <div class="filter-group" id="type-filters"></div>
        <button onclick="resetZoom()">Reset View</button>
        <button onclick="toggleLinks()">Toggle Links</button>
        <button onclick="focusLargest()">Focus Largest</button>
    </div>
    
    <!-- Graph Container -->
    <div id="graph-container"></div>
    
    <!-- Tooltip -->
    <div id="tooltip">
        <div class="path" id="tt-path"></div>
        <div class="meta" id="tt-type"></div>
        <div class="meta" id="tt-size"></div>
        <div class="meta" id="tt-modified"></div>
        <div class="meta" id="tt-category"></div>
    </div>
    
    <!-- Legend -->
    <div id="legend">
        <h4 style="color: #0f0; margin-bottom: 10px; font-size: 12px">FILE TYPES</h4>
        <div id="legend-items"></div>
    </div>
    
    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading 334,694 files...</div>
    </div>

    <script>
        // Load graph data
        fetch('graph_data.json')
            .then(r => r.json())
            .then(data => {
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                
                // Update stats
                document.getElementById('total-files').textContent = data.metadata.total_files.toLocaleString();
                document.getElementById('total-edges').textContent = data.metadata.total_edges.toLocaleString();
                document.getElementById('total-size').textContent = data.metadata.total_size_mb.toFixed(1);
                document.getElementById('total-types').textContent = Object.keys(data.metadata.file_types).length;
                
                // Build legend
                const legendDiv = document.getElementById('legend-items');
                const typeFilters = document.getElementById('type-filters');
                const types = Object.keys(data.metadata.file_types);
                
                types.forEach(type => {
                    // Legend item
                    const item = document.createElement('div');
                    item.className = 'legend-item';
                    const color = data.nodes.find(n => n.type === type)?.color || '#888';
                    item.innerHTML = `<div class="legend-color" style="background: ${color}; color: ${color}"></div>${type} (${data.metadata.file_types[type]})`;
                    legendDiv.appendChild(item);
                    
                    // Filter checkbox
                    const label = document.createElement('label');
                    label.style.display = 'block';
                    label.style.margin = '3px 0';
                    label.innerHTML = `<input type="checkbox" class="filter-checkbox" value="${type}" checked onchange="applyFilters()"> ${type}`;
                    typeFilters.appendChild(label);
                });
                
                // Setup D3 force simulation
                const width = window.innerWidth;
                const height = window.innerHeight - 120;
                
                const svg = d3.select('#graph-container')
                    .append('svg')
                    .attr('width', width)
                    .attr('height', height)
                    .call(d3.zoom().on('zoom', (event) => {
                        g.attr('transform', event.transform);
                    }));
                
                const g = svg.append('g');
                
                // Force simulation
                const simulation = d3.forceSimulation(data.nodes)
                    .force('link', d3.forceLink(data.edges).id(d => d.id).distance(100))
                    .force('charge', d3.forceManyBody().strength(-50))
                    .force('center', d3.forceCenter(width / 2, height / 2))
                    .force('collision', d3.forceCollide().radius(d => Math.sqrt(d.size / 1000) + 3));
                
                // Draw links
                const link = g.append('g')
                    .selectAll('line')
                    .data(data.edges)
                    .join('line')
                    .attr('class', 'link')
                    .attr('stroke', '#333')
                    .attr('stroke-width', 1);
                
                // Draw nodes
                const node = g.append('g')
                    .selectAll('circle')
                    .data(data.nodes)
                    .join('circle')
                    .attr('class', 'node')
                    .attr('r', d => Math.sqrt(d.size / 1000) + 2)
                    .attr('fill', d => d.color)
                    .attr('stroke', '#000')
                    .attr('stroke-width', 1)
                    .call(d3.drag()
                        .on('start', dragstarted)
                        .on('drag', dragged)
                        .on('end', dragended))
                    .on('mouseover', (event, d) => {
                        document.getElementById('tooltip').style.display = 'block';
                        document.getElementById('tt-path').textContent = d.path;
                        document.getElementById('tt-type').textContent = `Type: ${d.type}`;
                        document.getElementById('tt-size').textContent = `Size: ${(d.size / 1024).toFixed(2)} KB`;
                        document.getElementById('tt-modified').textContent = `Modified: ${d.modified}`;
                        document.getElementById('tt-category').textContent = `Category: ${d.category}`;
                    })
                    .on('mousemove', (event) => {
                        document.getElementById('tooltip')
                            .style('left', (event.pageX + 10) + 'px')
                            .style('top', (event.pageY - 10) + 'px');
                    })
                    .on('mouseout', () => {
                        document.getElementById('tooltip').style.display = 'none';
                    });
                
                // Update positions
                simulation.on('tick', () => {
                    link
                        .attr('x1', d => d.source.x)
                        .attr('y1', d => d.source.y)
                        .attr('x2', d => d.target.x)
                        .attr('y2', d => d.target.y);
                    
                    node
                        .attr('cx', d => d.x)
                        .attr('cy', d => d.y);
                });
                
                // Drag functions
                function dragstarted(event, d) {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                }
                
                function dragged(event, d) {
                    d.fx = event.x;
                    d.fy = event.y;
                }
                
                function dragended(event, d) {
                    if (!event.active) simulation.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }
                
                // Control functions
                window.applyFilters = function() {
                    const checked = Array.from(document.querySelectorAll('.filter-checkbox:checked')).map(cb => cb.value);
                    node.attr('opacity', d => checked.includes(d.type) ? 1 : 0.1);
                };
                
                window.resetZoom = function() {
                    svg.transition().duration(750).call(
                        d3.zoom().transform,
                        d3.zoomIdentity
                    );
                };
                
                window.toggleLinks = function() {
                    const current = link.attr('stroke-opacity');
                    link.attr('stroke-opacity', current === '0.3' ? '0' : '0.3');
                };
                
                window.focusLargest = function() {
                    const largest = data.nodes.sort((a, b) => b.size - a.size)[0];
                    svg.transition().duration(750).call(
                        d3.zoom().transform,
                        d3.zoomIdentity.translate(width/2 - largest.x, height/2 - largest.y).scale(3)
                    );
                };
                
                console.log('✅ Graph loaded:', data.metadata);
            })
            .catch(err => {
                console.error('Error loading graph:', err);
                document.getElementById('loading').innerHTML = 
                    '<div style="color: #f00">Error loading graph_data.json<br>Make sure you ran the bash script first.</div>';
            });
    </script>
</body>
</html>
