[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation25"
version = "0.1.0"
description = "Sovereign AI Platform - 25 Planetary Agents"
authors = [{name = "CyGeL", email = "cygel.co@gmail.com"}]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
c25 = "constellation25.cli:main"
